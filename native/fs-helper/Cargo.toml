[package]
name = "meta-mover-fs-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
libc = "=0.2.182"
rustix = { version = "=1.1.4", features = ["fs"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
