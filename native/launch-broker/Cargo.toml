[package]
name = "meta-mover-launch-broker"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.182"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
