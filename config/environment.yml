name: metamover-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Node.js (includes npm)
  - nodejs=18
  
  # Python (for native module compilation)
  - python=3.11
  - pip
  
  # Build tools
  - make
  - cmake
  - pkg-config
  
  # Core libraries
  - libffi
  - zlib
  - openssl
  
  # Development tools
  - git
  
variables:
  # Ensure npm uses local node_modules
  NPM_CONFIG_PREFIX: $CONDA_PREFIX
  # Set proper paths for native compilation
  PKG_CONFIG_PATH: $CONDA_PREFIX/lib/pkgconfig
  # Electron cache location
  ELECTRON_CACHE: $CONDA_PREFIX/.cache/electron
  # Node modules path
  NODE_PATH: $CONDA_PREFIX/lib/node_modules