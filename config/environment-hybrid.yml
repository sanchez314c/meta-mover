name: metamover-dev
channels:
  - conda-forge
  - defaults
dependencies:
  # Python for native module compilation
  - python=3.11
  - pip
  
  # Essential build tools
  - make
  - cmake
  - pkg-config
  - setuptools
  - wheel
  
  # Core system libraries for native modules
  - libffi
  - zlib
  - openssl
  
  # Development tools
  - git

variables:
  # Set paths for development
  PKG_CONFIG_PATH: $CONDA_PREFIX/lib/pkgconfig
  ELECTRON_CACHE: $CONDA_PREFIX/.cache/electron
  # Use system Node.js but project-local packages
  NPM_CONFIG_PREFIX: $CONDA_PREFIX
  NODE_PATH: $CONDA_PREFIX/lib/node_modules