<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' https://github.com https://api.github.com https://objects.githubusercontent.com;
    ">
    <title>Meta Mover</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-void: #0a0b0e;
            --bg-card: #141518;
            --accent-teal: #14b8a6;
            --text-primary: #e8e8ec;
            --text-muted: #5c5c6a;
            --gradient-bg: linear-gradient(160deg, #0a0b0e, #0f1012);
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: transparent !important;
            margin: 0;
        }

        body {
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', Roboto, sans-serif;
            color: var(--text-primary);
            -webkit-app-region: drag;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 20px;
            border-radius: 36px;
            box-shadow:
                0 4px 8px  rgba(0,0,0,0.4),
                0 8px 20px rgba(0,0,0,0.45),
                0 14px 36px rgba(0,0,0,0.35);
            pointer-events: none;
            z-index: -1;
        }

        #root {
            height: 100%;
            width: 100%;
            -webkit-app-region: no-drag;
        }

        /* Loading screen */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            background: var(--gradient-bg);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255,255,255,0.03);
            overflow: hidden;
            color: var(--text-primary);
        }

        .loading-logo {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-teal);
            margin-bottom: 8px;
            letter-spacing: -0.025em;
        }

        .loading-subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 2px solid rgba(20, 184, 166, 0.15);
            border-radius: 50%;
            border-top-color: var(--accent-teal);
            animation: spin 0.9s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px;
            padding: 0; margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-screen">
            <div class="loading-logo">Meta Mover</div>
            <div class="loading-subtitle">Media File Organizer</div>
            <div class="loading-spinner"></div>
        </div>
    </div>
</body>
</html>
